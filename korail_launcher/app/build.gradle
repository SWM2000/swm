subprojects {
    apply plugin: 'jacoco'

    sourceCompatibility = '18'

    repositories {
        mavenCentral()
    }

    jacoco {
//		reportsDirectory = 'build/reports/jacoco'
        toolVersion = '0.8.8'
    }

    test {
        useJUnitPlatform()
        finalizedBy 'jacocoTestReport'
    }

//	test {
//		jacoco {
//			enabled = true
//			destinationFile = file("$buildDir/jacoco/${name}.exec")
//			includes = []
//			excludes = []
//			excludeClassLoaders = []
//			includeNoLocationClasses = false
//			sessionId = "<auto-generated value>"
//			dumpOnExit = true
//			classDumpDir = null
//			output = JacocoTaskExtension.Output.FILE
//			address = "localhost"
//			port = 6300
//			jmx = false
//		}
//	}

    jacocoTestReport {
        reports {
            html.enabled false
            xml.enabled true
            csv.enabled false

            html.destination file("$buildDir/jacoco/jacoco.html")
            xml.destination file("$buildDir/jacoco/jacoco.xml")
        }
        finalizedBy 'jacocoTestCoverageVerification'
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                // 'element'가 없으면 프로젝트의 전체 파일을 합친 값을 기준으로 한다.
                limit {
                    // 'counter'를 지정하지 않으면 default는 'INSTRUCTION'
                    // 'value'를 지정하지 않으면 default는 'COVEREDRATIO'
                    minimum = 0.30
                }
            }

            rule {
                // 룰을 간단히 켜고 끌 수 있다.
                enabled = true

                // 룰을 체크할 단위는 클래스 단위
                element = 'CLASS'

                // 브랜치 커버리지를 최소한 50% 만족시켜야 한다.
                limit {
                    counter = 'BRANCH'
                    value = 'COVEREDRATIO'
                    minimum = 0.50
                }

                // 라인 커버리지를 최소한 50% 만족시켜야 한다.
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.50
                }

                // 빈 줄을 제외한 코드의 라인수를 최대 300라인으로 제한한다.
                limit {
                    counter = 'LINE'
                    value = 'TOTALCOUNT'
                    maximum = 100
//              maximum = 8
                }

                // 커버리지 체크를 제외할 클래스들
                excludes = [
                        '*.test.*',
                ]
            }
        }
    }
}

android {
    namespace 'com.korail.motrex.launcher'
    compileSdk 33

    defaultConfig {
        applicationId "com.korail.motrex.launcher"
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "FTPS_ADDRESS", "\"211.170.156.217\""
        buildConfigField "String", "FILE_VERSION_INFO_URL", "\"http://192.168.0.2:8980/uFileVerInfo.ini\""
        buildConfigField "String", "SCREEN_GPIO_PATH", "\"/sys/class/gpio/gpio185/value\""
    }

    buildFeatures {
        compose = true
        buildConfig = true
        viewBinding true
        aidl true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "../../../apk_outputs/" + "ktxlauncher.apk"
        }
    }
}

